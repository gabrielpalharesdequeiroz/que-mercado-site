<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050805">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Admin | Que Mercado</title>
  </head>
  <body class="admin-body">
    <main class="admin-login">
      <div class="login-card">
        <img src="assets/que-mercado-logo.png" alt="Que Mercado">
        <span>PAINEL ADMINISTRATIVO</span>
        <h1>Conteúdo e leads em um só lugar.</h1>
        <p>Entre com o usuário administrador cadastrado no Supabase.</p>
        <div class="setup-alert" id="setupAlert" hidden>
          O Supabase ainda não foi configurado. Preencha <strong>supabase-config.js</strong> para liberar o acesso.
        </div>
        <form id="adminLogin">
          <label>E-mail<input id="loginEmail" name="email" type="email" autocomplete="email" required placeholder="admin@quemercado.com.br"></label>
          <label>Senha<input id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
          <button class="btn btn-primary btn-full" type="submit">Entrar no painel</button>
          <div class="admin-feedback" id="loginFeedback" aria-live="polite"></div>
        </form>
        <a href="index.html" class="back-link">← Voltar ao site</a>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="cms.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
